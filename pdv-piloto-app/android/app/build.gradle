/**
 * ============================================================================
 * CONFIGURAÇÃO CENTRALIZADA DE REPOSITÓRIOS
 * ============================================================================
 */

/**
 * ============================================================================
 * CONFIGURAÇÃO DE JSC (JavaScriptCore)
 * ============================================================================
 */
def jscFlavor = 'org.webkit:android-jsc:+'

/**
 * ============================================================================
 * CONFIGURAÇÃO DE REPOSITÓRIOS (MOVIDO PARA build.gradle RAIZ)
 * ============================================================================
 * 
 * Os repositórios agora estão configurados no build.gradle raiz em allprojects
 * seguindo o padrão do Stone Demo:
 * 
 * - Stone PackageCloud (público)
 * - Stone PackageCloud Internal
 * - Sonatype Snapshots
 * - Google/Maven Central
 */

/**
 * ============================================================================
 * CONFIGURAÇÃO CENTRALIZADA DE DEPENDÊNCIAS
 * ============================================================================
 */

// Dependências por adquirente (com versões centralizadas)
def acquirerDependencies = [
    'stone': [
        "br.com.stone:stone-sdk:${rootProject.ext.stone_sdk_version}",
        "br.com.stone:stone-sdk-posandroid:${rootProject.ext.stone_sdk_version}",
        "br.com.stone:stone-sdk-posandroid-positivo:${rootProject.ext.stone_sdk_version}",
        "br.com.stone:stone-sdk-posandroid-ingenico:${rootProject.ext.stone_sdk_version}",
        "br.com.stone:stone-sdk-posandroid-sunmi:${rootProject.ext.stone_sdk_version}",
        "br.com.stone:stone-sdk-posandroid-gertec:${rootProject.ext.stone_sdk_version}"
    ],
    'cielo': [
        // Exemplo para Cielo:
        // "br.com.cielo.sdk:cielo-sdk:${rootProject.ext.cielo_sdk_version}",
        // "br.com.cielo.sdk:cielo-sdk-posandroid:${rootProject.ext.cielo_sdk_version}"
    ],
    'pagseguro': [
        // Exemplo para PagSeguro:
        // "br.com.pagseguro.sdk:pagseguro-sdk:${rootProject.ext.pagseguro_sdk_version}"
    ]
]

/**
 * Configuração Android
 */
android {
    namespace "br.com.nebulasistemas.pdvpilotoapp"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "br.com.nebulasistemas.pdvpilotoapp"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
    }
    
    /**
     * Configuração de Java 17 (alinhado com Stone Demo)
     */
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    /**
     * Configuração Kotlin
     */
    kotlinOptions {
        jvmTarget = "17"
    }
    
    /**
     * Packaging Options (alinhado com Stone Demo)
     */
    packagingOptions {
        exclude 'META-INF/api_release.kotlin_module'
        exclude 'META-INF/client_release.kotlin_module'
    }

    /**
     * Product Flavors para diferentes adquirentes e fabricantes
     */
    flavorDimensions "acquirer", "manufacturer"
    productFlavors {
        // ===== ADQUIRENTES =====
        stone {
            dimension "acquirer"
            applicationIdSuffix ".stone"
            versionNameSuffix "-stone"
            
            buildConfigField "String", "ACQUIRER_NAME", '"Stone"'
            buildConfigField "String", "ACQUIRER_TYPE", '"stone"'
            buildConfigField "boolean", "ENABLE_STONE", "true"
            buildConfigField "boolean", "ENABLE_CIELO", "false"
        }
        
        cielo {
            dimension "acquirer"
            applicationIdSuffix ".cielo"
            versionNameSuffix "-cielo"
            
            buildConfigField "String", "ACQUIRER_NAME", '"Cielo"'
            buildConfigField "String", "ACQUIRER_TYPE", '"cielo"'
            buildConfigField "boolean", "ENABLE_STONE", "false"
            buildConfigField "boolean", "ENABLE_CIELO", "true"
        }
        
        // ===== FABRICANTES =====
        gertec {
            dimension "manufacturer"
            applicationIdSuffix ".gertec"
            versionNameSuffix "-gertec"
            buildConfigField "String", "STONE_MANUFACTURER", '"gertec"'
        }
        
        ingenico {
            dimension "manufacturer"
            applicationIdSuffix ".ingenico"
            versionNameSuffix "-ingenico"
            buildConfigField "String", "MANUFACTURER_NAME", '"Ingenico"'
            buildConfigField "String", "MANUFACTURER_TYPE", '"ingenico"'
        }
        
        positivo {
            dimension "manufacturer"
            applicationIdSuffix ".positivo"
            versionNameSuffix "-positivo"
            buildConfigField "String", "MANUFACTURER_NAME", '"Positivo"'
            buildConfigField "String", "MANUFACTURER_TYPE", '"positivo"'
        }
        
        sunmi {
            dimension "manufacturer"
            applicationIdSuffix ".sunmi"
            versionNameSuffix "-sunmi"
            buildConfigField "String", "STONE_MANUFACTURER", '"sunmi"'
        }
        
        tectoy {
            dimension "manufacturer"
            applicationIdSuffix ".tectoy"
            versionNameSuffix "-tectoy"
            buildConfigField "String", "STONE_MANUFACTURER", '"tectoy"'
        }
    }


    /**
     * Build Types
     */
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            debuggable true
            minifyEnabled false
        }
        
        release {
            // Configuração de assinatura será aplicada dinamicamente por flavor
            minifyEnabled true
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    /**
     * Configuração de assinatura por fabricante
     */
    signingConfigs {
        // Aplicar configurações de assinatura para cada fabricante
        stoneManufacturers.each { manufacturer, config ->
            def keystoreFile = config.keystoreFile
            def keystoreProperties = new Properties()
            
            if (file(keystoreFile).exists()) {
                keystoreProperties.load(new FileInputStream(file(keystoreFile)))
                
                "${manufacturer}" {
                    storeFile file("${keystoreFile.replace('keystore.properties', keystoreProperties.getProperty('storeFile'))}")
                    keyAlias keystoreProperties.getProperty('keyAlias')
                    keyPassword keystoreProperties.getProperty('keyPassword')
                    storePassword keystoreProperties.getProperty('storePassword')
                }
                
                println "✅ Configuração de assinatura carregada para ${manufacturer}"
            } else {
                println "⚠️ Arquivo de keystore não encontrado para ${manufacturer}: ${keystoreFile}"
            }
        }
    }



    /**
     * Source Sets - incluir código Stone SDK
     */
    sourceSets {
        main {
            java {
                srcDirs += [
                    '../../packages/stone-sdk/android/payment',
                    '../../packages/stone-sdk/android/printer'
                ]
            }
        }
    }
}

/**
 * ============================================================================
 * REPOSITÓRIOS (REMOVIDO - AGORA EM build.gradle RAIZ)
 * ============================================================================
 * 
 * Os repositórios foram movidos para o build.gradle raiz (allprojects)
 * para seguir o padrão do Stone Demo e evitar duplicação.
 */

/**
 * ============================================================================
 * DEPENDÊNCIAS CENTRALIZADAS POR ADQUIRENTE
 * ============================================================================
 */
dependencies {
    // React Native
    implementation("com.facebook.react:react-android")
    
    // Hermes Engine
    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
    
    // Dependências comuns do Android
    implementation("androidx.appcompat:appcompat:1.6.1")
    implementation("com.google.android.material:material:1.9.0")
    
    // Dependência do módulo Cielo SDK
    implementation project(':cielo-sdk')
    
    // Dependência do módulo Payment Core
    implementation project(':payment-core')
    
    // Dependências de Debug (alinhado com Stone Demo)
    debugImplementation("br.com.stone.sdk.android:debugmode:4.0.3")
    debugImplementation("com.github.tony19:logback-android:2.0.0")
    
    // Dependências por adquirente
    acquirerDependencies.each { acquirer, deps ->
        deps.each { dep ->
            if (acquirer == 'stone') {
                // Stone: aplicar a todas as variantes por enquanto
                implementation(dep)
                println "📦 Dependência ${acquirer.toUpperCase()}: ${dep}"
            } else {
                // Outros adquirentes: aplicar quando implementados
                println "🚧 Dependência ${acquirer.toUpperCase()} (futuro): ${dep}"
            }
        }
    }
    
    // Dependências específicas por fabricante (quando necessário)
    stoneManufacturers.keySet().each { manufacturer ->
        // Exemplo: dependências específicas por fabricante
        // "${manufacturer}Implementation"("br.com.stone:stone-sdk-posandroid-${manufacturer}:4.8.7")
        println "🏭 Fabricante ${manufacturer.toUpperCase()} configurado"
    }
}

/**
 * React Native Configuration
 */
react {
    root = file("../../")
    reactNativeDir = file("../../node_modules/react-native")
    codegenDir = file("../../node_modules/react-native-codegen")
    cliFile = file("../../node_modules/react-native/cli.js")

    debuggableVariants = ["gertecDebug", "ingenicoDebug", "positivoDebug", "sunmiDebug", "tectoyDebug"]
}

// Comentado: native_modules.gradle não existe mais nesta versão do React Native
