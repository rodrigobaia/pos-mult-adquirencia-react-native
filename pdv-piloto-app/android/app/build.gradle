def pagseguroManufacturers = [
    // Exemplo para quando implementar PagSeguro:
    // 'moderninha': [
    //     keystoreFile: '../manufacturers/pagseguro/moderninha/moderninha-keystore.properties',
    //     signingConfig: '../manufacturers/pagseguro/moderninha/moderninha-signing-config.gradle'
