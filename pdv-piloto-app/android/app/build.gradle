/**
 * ============================================================================
 * COMO ADICIONAR NOVO ADQUIRENTE
 * ============================================================================
 * 
 * 1. ADICIONAR REPOSITÓRIO:
 *    - Editar a variável 'acquirerRepositories' (linha ~65)
 *    - Adicionar: 'novo_adquirente': 'https://repo-url.com'
 * 
 * 2. ADICIONAR DEPENDÊNCIAS:
 *    - Editar a variável 'acquirerDependencies' (linha ~78)
 *    - Adicionar: 'novo_adquirente': ['dep1', 'dep2']
 * 
 * 3. ADICIONAR FABRICANTES:
 *    - Criar pasta: android/manufacturers/novo_adquirente/
 *    - Adicionar fabricantes na variável 'novoAdquirenteManufacturers'
 * 
 * 4. CRIAR SDK:
 *    - Criar pasta: packages/novo_adquirente-sdk/
 *    - Implementar providers TypeScript e Kotlin
 * 
 * 5. ATUALIZAR LÓGICA:
 *    - Modificar condição na linha ~244 para incluir novo adquirente
 *    - Adicionar flavors específicos se necessário
 * 
 * Exemplo completo em: android/manufacturers/README.md
 */