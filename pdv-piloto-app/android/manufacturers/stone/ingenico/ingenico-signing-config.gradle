def keystorePropertiesFile = rootProject.file("android/manufacturers/stone/ingenico/ingenico-keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    signingConfigs {
        ingenico {
            storeFile rootProject.file("android/manufacturers/stone/ingenico/${keystoreProperties.getProperty('storeFile', System.env.INGENICO_KEYSTORE_FILE)}")
            keyAlias keystoreProperties.getProperty('keyAlias', System.env.INGENICO_KEYSTORE_ALIAS)
            keyPassword keystoreProperties.getProperty('keyPassword', System.env.INGENICO_KEYSTORE_KEY_PASSWORD)
            storePassword keystoreProperties.getProperty('storePassword', System.env.INGENICO_KEYSTORE_PASSWORD)
        }
    }
}