# ============================================================================
# CONFIGURAÇÃO DE VERSÃO DO APLICATIVO
# ============================================================================
# 
# Este arquivo centraliza a versão do aplicativo Android.
# A versão é usada tanto no build.gradle quanto pode ser sincronizada
# com o package.json para manter consistência entre versões nativas e JS.
#
# Formato:
# - versionCode: número inteiro incremental (usado pelo Google Play)
# - versionName: string da versão (exibida ao usuário)
#
# Exemplo de versionamento semântico:
# - versionCode: incrementa a cada release (1, 2, 3, ...)
# - versionName: formato "MAJOR.MINOR.PATCH" ou "MAJOR.MINOR.PATCH Release N"
#
# ============================================================================

# Versão do aplicativo Android
VERSION_CODE=1
VERSION_NAME=2.0.0

# Versão com sufixo de release (opcional, usado para builds internos)
VERSION_NAME_SUFFIX=Release 3

# Application ID (mantido aqui para referência, mas definido no build.gradle)
# APPLICATION_ID=br.com.nebulasistemas.pdvpilotoapp

